# Builds Sleep Mac and publishes a GitHub release when a version tag is pushed:
#   git tag v1.1.0 && git push origin v1.1.0
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          swift --version

      - name: Build, test and package
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          export VERSION
          scripts/build_app.sh

      - name: Check the app version
        run: |
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "dist/Sleep Mac.app/Contents/Info.plist"
          lipo -archs "dist/Sleep Mac.app/Contents/MacOS/SleepMac"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/Sleep-Mac.dmg dist/Sleep-Mac.zip \
            --title "Sleep Mac ${GITHUB_REF_NAME}" \
            --generate-notes \
            --notes "Ad-hoc signed (no Developer ID): the first time, right-click Sleep Mac.app and choose Open."
